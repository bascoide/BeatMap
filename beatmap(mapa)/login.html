<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Beatmap</title>
    <link rel="icon" href="icone.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <div class="login-container">
      <h1 class="login-title">BEAT<span>MAP</span></h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Utilizador</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Palavra-passe</label>
          <input type="password" id="password" name="password" required />
        </div>
        <div id="errorMessage" class="error-message"></div>
        <button type="submit" class="login-submit-btn">Entrar</button>
      </form>
      <div class="login-footer">
        <p>Não tem conta? <a href="register.html">Registe-se aqui</a>.</p>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
