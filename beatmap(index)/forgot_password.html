<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Password | BeatMap</title>
    <link rel="icon" href="icone.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .auth-container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(rgba(10, 10, 10, 0.7), rgba(10, 10, 10, 0.7)),
          url("fundo-do-site.gif");
        background-size: cover;
      }
      .auth-card {
        background: #1a1a1a;
        padding: 40px;
        border-radius: 20px;
        border: 1px solid #2a2a2a;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .auth-card h2 {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
      }
      .auth-card h2 span {
        color: var(--primary);
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--text-muted);
      }
      .form-group input {
        width: 100%;
        padding: 12px 15px;
        background: #0a0a0a;
        border: 1px solid #333;
        border-radius: 8px;
        color: white;
        outline: none;
        transition: var(--transition);
      }
      .form-group input:focus {
        border-color: var(--primary);
      }
      .form-group select {
        width: 100%;
        padding: 12px 15px;
        background: #0a0a0a;
        border: 1px solid #333;
        border-radius: 8px;
        color: white;
        outline: none;
        transition: var(--transition);
      }
      .form-group select:focus {
        border-color: var(--primary);
      }
      .btn-submit {
        width: 100%;
        padding: 15px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
      }
      .btn-submit:hover {
        transform: translateY(-3px);
        filter: brightness(1.2);
      }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
      }
      .back-link:hover {
        color: white;
      }

      /* Estilos para as mensagens de alerta */
      .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        text-align: center;
        display: none;
      }
      .alert-success {
        background: rgba(115, 49, 223, 0.2);
        border: 1px solid var(--primary);
        color: #fff;
      }
      .alert-error {
        background: rgba(255, 50, 50, 0.2);
        border: 1px solid #ff3232;
        color: #ffcccc;
      }
    </style>
  </head>
  <body>
    <main class="auth-container">
      <div class="auth-card">
        <div class="logo" style="text-align: center; margin-bottom: 20px">
          BEAT<span>MAP</span>
        </div>
        <h2>Recuperar <span>Conta.</span></h2>

        <div id="message-box"></div>

        <p
          style="
            color: #a0a0a0;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
          "
        >
          Insere o teu email para receberes um link de recuperação.
        </p>

        <form action="send_reset_link.php" method="POST">
          <div class="form-group">
            <label>E-mail</label>
            <input
              type="email"
              name="email"
              placeholder="exemplo@email.com"
              required
            />
          </div>
          <button type="submit" class="btn-submit">Enviar Link</button>
        </form>

        <a href="login.html" class="back-link" id="back-link"
          >← Voltar ao Login</a
        >
      </div>
    </main>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get("status");
      const msgBox = document.getElementById("message-box");

      if (status === "success") {
        msgBox.innerHTML =
          '<div class="alert alert-success">Link de recuperação enviado! Verifica o teu email.</div>';
        msgBox.querySelector(".alert").style.display = "block";
      } else if (status === "not_found") {
        msgBox.innerHTML =
          '<div class="alert alert-error">Não encontramos nenhuma conta com esse email.</div>';
        msgBox.querySelector(".alert").style.display = "block";
      } else if (status === "mail_error") {
        msgBox.innerHTML =
          '<div class="alert alert-error">Erro ao enviar email. Tenta novamente mais tarde.</div>';
        msgBox.querySelector(".alert").style.display = "block";
      }
    </script>
  </body>
</html>
